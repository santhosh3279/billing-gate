server {
    listen 80;
    listen [::]:80;
    server_name billing.chettiyarkada.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name billing.chettiyarkada.in;

    ssl_certificate /etc/letsencrypt/live/billing.chettiyarkada.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.chettiyarkada.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100M;

    # Internal subrequest for 2FA gate authentication check
    location = /_gate/verify {
        internal;
        proxy_pass http://127.0.0.1:3100/gate/api/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth Gate Landing Page, Google Authenticator enrollment & APIs
    location /gate/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Redirect unauthenticated requests to the 2FA Gate landing page
    location @gate_redirect {
        return 302 https://$host/gate/login?return_to=$scheme://$http_host$request_uri;
    }

    # =========================================================================
    # PUBLIC ACCESS: Shared Product Catalogue & Public Assets (NO 2FA REQUIRED)
    # =========================================================================

    # Public static assets (CSS, JS, fonts, icons)
    location ^~ /assets/ {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Public product images for the catalogue
    location ^~ /files/ {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Public catalogue viewer routes (e.g. /frontend/catalogueviewer, /frontend/catalogueviewer/)
    location ^~ /frontend/catalogueviewer {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Public offer & catalogue sub-routes
    location ^~ /frontend/catalogue {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /frontend/catalougepage {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /frontend/catelogue {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /catalogue/ {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /catelogue {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Public APIs required by the catalogue viewer
    location ^~ /api/method/ssplbilling.api.offer_api {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/method/ssplbilling.api.catalogue_order_api {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/method/ssplbilling.api.dashboard_api.get_frappe_site_name {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/method/ssplbilling.api.dashboard_api.get_server_time {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/method/ssplbilling.api.auth_api.get_csrf_token {
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # PROTECTED ACCESS: Billing System & ERPNext (GOOGLE AUTHENTICATOR 2FA)
    # =========================================================================

    # Frappe realtime WebSocket proxy (protected by 2FA gate)
    location /socket.io/ {
        auth_request /_gate/verify;
        error_page 401 = @gate_redirect;

        if ($http_origin !~ "^(https://billing\.chettiyarkada\.in)?$") {
            return 403;
        }
        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $erp_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin https://billing.chettiyarkada.in always;
    }

    # Protected Billing Portal and ERPNext backend (protected by 2FA gate)
    location / {
        auth_request /_gate/verify;
        error_page 401 = @gate_redirect;

        proxy_pass http://192.168.225.135;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $erp_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect http://192.168.225.135/ https://billing.chettiyarkada.in/;
    }
}
